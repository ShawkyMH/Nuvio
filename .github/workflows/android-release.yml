name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Setup Signing Keystore
        id: setup_keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "==> Decoding release keystore from secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore
            echo "KEYSTORE_FILE=/tmp/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "HAS_KEYSTORE=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Release keystore secret ANDROID_KEYSTORE_BASE64 not configured. Building with fallback signing."
            echo "HAS_KEYSTORE=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f /tmp/release.keystore

      - name: Package Release Assets
        id: package_assets
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          fi
          
          mkdir -p release-artifacts
          
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          
          TARGET_APK="release-artifacts/nuvio-${TAG_NAME}.apk"
          cp "$APK_SOURCE" "$TARGET_APK"
          
          cd release-artifacts
          sha256sum "nuvio-${TAG_NAME}.apk" > "nuvio-${TAG_NAME}.apk.sha256"
          cat "nuvio-${TAG_NAME}.apk.sha256"
          cd ..
          
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_assets.outputs.TAG_NAME }}
          name: "Nuvio ${{ steps.package_assets.outputs.TAG_NAME }}"
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
